name: My First Workflow
on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  first_job:
    name: My First Job
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Repository Code
       uses: actions/checkout@v4
     - name: Display Repository Tree
       run: tree
    
     - name: Change README Header using sed
       run: |
         echo "=== Modifying README Header ==="
         # This swaps any line starting with '#' to '# My Checkout'
         sed -i 's/^#.*/# My Checkout - Approved/' README.md
       shell: bash

     - name: Verify Modified README
       run: |
         echo "=== Checking current README contents ==="
         cat README.md
       shell: bash

     - name: Greet the user
       run: |
        echo "Hello ${{github.actor}}"
        echo "Current branch is '${{ github.ref }}'."
        echo "My API key will '${{ secrets.APIKEY }}'."
        echo "My Persekitaran is '${{ vars.PERSEKITARAN }}'."

        echo "My API key will '${{ env.API_KEY }}'."
        echo "My Persekitaran is '${{ env.MYPERSEKITARAN }}'."
       env:
        API_KEY: ${{ secrets.APIKEY }}
        MYPERSEKITARAN: ${{ vars.PERSEKITARAN }}
        


       shell: bash
     
    
    
