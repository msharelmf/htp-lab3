name: My First Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  first_job:
    name: My First Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Display Repository Tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
          tree

      - name: Change README Header using sed
        run: |
          echo "=== Modifying README Header ==="
          sed -i '0,/^#.*/s/^#.*/# My Checkout - Approved/' README.md
        shell: bash

      - name: Verify Modified README
        run: |
          echo "=== Checking current README contents ==="
          cat README.md
        shell: bash

      - name: Greet the user
        run: |
          echo "Hello ${{ github.actor }}"
          echo "Current branch is '${{ github.ref }}'."
        shell: bash
